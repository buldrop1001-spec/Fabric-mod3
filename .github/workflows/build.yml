name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Gradle 8.12 fits the 1.21.4 project. For the 1.21.11 project use 8.14.3.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Unpack the project zip from the repo
        run: |
          mkdir project
          unzip -q ./*.zip -d project

      - name: Build
        run: |
          cd project/*/
          gradle build --no-daemon
          rm -f build/libs/*-sources.jar

      - name: Publish the jar as a release (direct download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Input Overlay build ${{ github.run_number }}
          files: project/*/build/libs/*.jar
          
